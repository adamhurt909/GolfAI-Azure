# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - golfai-ah-container

on:
  push:
    branches:
      - docker-main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: golfaiacr909.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_F4647DFAE0F74E859FFCF9E9FE2111DA }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_38FA7DC2E78D4AB99BA34687B164D5EC }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: golfaiacr909.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_F4647DFAE0F74E859FFCF9E9FE2111DA }}/golfai:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2E735EAF3A054A988764758DD844E998 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CDC34637C4D44F1BBB4CBAF1589799D7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D46F0DC1F6984DAFAFFD95B9C9BDF7C8 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'golfai-ah-container'
          slot-name: 'Production'
          images: 'golfaiacr909.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_F4647DFAE0F74E859FFCF9E9FE2111DA }}/golfai:${{ github.sha }}'
          